<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WikiRace P2P</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="nameScreen" class="name-screen">
    <div class="name-card">
        <h1>WikiRace P2P</h1>
        <p>Entre ton pseudo pour commencer.</p>
        <input id="nicknameInput" placeholder="Ton pseudo" maxlength="20">
        <button id="confirmNickname">Continuer</button>
        <p id="nameHint"></p>
    </div>
</div>

<div id="gameScreen" class="game-screen hidden">

    <div class="topbar">
        <h1>WikiRace P2P</h1>

        <div class="lobby-panel">
            <span id="nicknameDisplay"></span>
            <button id="createRoom">Créer un lobby</button>
            <input id="roomIdInput" placeholder="ID du lobby">
            <button id="joinRoom">Rejoindre</button>
            <button id="copyInvite" disabled>Copier le lien d'invitation</button>
        </div>

        <div class="game-actions">
            <select id="startModeSelect">
                <option value="casual">Départ : liste casual</option>
                <option value="wikipedia">Départ : Wikipédia aléatoire</option>
            </select>

            <select id="targetModeSelect">
                <option value="casual">Objectif : liste casual</option>
                <option value="wikipedia">Objectif : Wikipédia aléatoire</option>
            </select>

            <button id="newGame" disabled>Lancer la partie</button>
            <button id="restartGame" disabled>Restart</button>
            <button id="giveUpButton" disabled>Abandonner</button>
        </div>

        <div class="room-info">
            <span id="peerStatus">Déconnecté</span>
            <span id="roomIdDisplay"></span>
            <span id="inviteStatus"></span>
            <span id="finishStatus"></span>
        </div>

        <div class="infos">
            <span id="start"></span>
            <span id="target"></span>
            <span id="clicks">0 clic</span>
            <span id="timer">0 s</span>
        </div>

        <div id="players"></div>
    </div>

    <div id="article">
        <h2>Bienvenue sur WikiRace P2P</h2>
        <p>Crée un lobby ou rejoins un ami avec son lien d'invitation.</p>
    </div>

</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="pages.js"></script>
<script src="app.js"></script>

</body>
</html>
